[Common]
Name=Canon
Model=OCT-A1
FirmwareVersion=<unbekannt>
FileVersion=1.9.0.13

[Logging]
UseFileLog=1
Path=D:\MEDISTAR\prg4\msga\middleware-logs\
FileName=CANOCT1-OPTO14.log
UseEventLog=0
UseSysLog=0
SysLogServer=127.255.255.255
SysLogPort=514
Level=production

[Format]
Import=NDD
Export=GDT

[NDD]
Format=import
Type=none
Path=
ExternalFilesPath=
BackupFiles=0
BackupPath=
StoreTransformedFiles=0
PatientIDConversion=1
ExecutableStart=1
ExecutablePath=C:\Program Files\Canon\OCT-A1\
ExecutableFileName=Canon.M210.App.exe
ExecutableParams=/UserID: "canon" /Password: "canon" /Command: "PATIENT"
ExecutableParamsAddPatientID=1
ExecutableParamsPatientID=/PatientID: "%s"
ExecutableParamsAddPatientName=1
ExecutableParamsPatientName=/PatientNameSingle: "%s"
ExecutableParamsAddPatientSex=1
ExecutableParamsPatientSex=/Sex: "%s"
ExecutableParamsPatientSexFormat=(M|F|O)
ExecutableParamsAddPatientBirthDate=1
ExecutableParamsPatientBirthDate=/BirthDate: "%s"
ExecutableParamsPatientBirthDateFormat=yyyymmdd
ExecutableParamsAddPatientEthnicGroup=0
ExecutableParamsPatientEthnicGroup=/EthnicGroup: "%s"
ExecutableParamsPatientEthnicGroupFormat=(Asian|Black|Hispanic|White)

[NDD-OPTO14]
OutputGDTData=1
OutputGDTDataPath=D:\MEDISTAR\prg4\msga\middleware-device-configs\
OutputGDTDataFileName=CANOCT1-OPTO14-gdt-data.txt
OutputGDTLineSeparator=<CR><LF>
OutputGDTIdentifier=GDTFID
OutputGDTValueSeparator=[=]
Description=

[GDT]
Format=export
Version=2.1
Charset=3
IgnoreMaxLineLength=1
NameValueSeparator=[=]
NameValueAppendSeparator=[space]
Type=file
Path=D:\MEDISTAR\prg4\msga\middleware-medistar-import-v\
BackupFiles=0
BackupPath=D:\MEDISTAR\prg4\msga\middleware-medistar-import-backup-v\

[License]
Path=D:\MEDISTAR\prg4\msga\middleware-license\
FileName=CANOCT1.crt