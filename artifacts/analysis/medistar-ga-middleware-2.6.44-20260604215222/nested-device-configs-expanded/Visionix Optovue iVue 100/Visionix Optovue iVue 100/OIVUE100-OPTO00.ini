[Common]
Name=Visionix
Model=Optovue iVue 100
FirmwareVersion=<unbekannt>
FileVersion=1.9.0.2

[Logging]
UseFileLog=1
Path=D:\MEDISTAR\prg4\msga\middleware-logs\
FileName=OIVUE100-OPTO00.log
UseEventLog=0
UseSysLog=0
SysLogServer=127.255.255.255
SysLogPort=514
Level=production

[Format]
Import=NDD
Export=GDT

[NDD]
Format=import
Type=file
Path=D:\MEDISTAR\prg4\msga\middleware-device-export\OIVUE100-OPTO00\
ClearPath=1
ExternalFilesPath=
BackupFiles=0
BackupPath=D:\MEDISTAR\prg4\msga\middleware-device-export-backup\OIVUE100-OPTO00\
StoreTransformedFiles=0
PatientIDConversion=1
ExecutableStart=1
ExecutablePath=C:\ivue80\bin\
ExecutableFileName=ivue.exe
ExecutableParams=
ExecutableParamsAddPatientID=1
ExecutableParamsPatientID="%s"
ExecutableParamsAddPatientName=1
ExecutableParamsPatientName="%s" "%s" "n/a"
ExecutableParamsAddPatientSex=1
ExecutableParamsPatientSex="%s"
ExecutableParamsPatientSexFormat=(m|f)
ExecutableParamsAddPatientBirthDate=1
ExecutableParamsPatientBirthDate="%s"
ExecutableParamsPatientBirthDateFormat=mm/dd/yyyy
ExecutableParamsAddPatientEthnicGroup=1
ExecutableParamsPatientEthnicGroup="n/a"
ExecutableParamsPatientEthnicGroupFormat=(African Descendant|American Indian|Chinese|Japanese|Caucasian|Hispanic|Indian|Pacific Islander|other combined)
ExecutableParamsAddPatientVisitDate=1
ExecutableParamsPatientVisitDate="%s"
ExecutableParamsPatientVisitDateFormat=mm/dd/yyyy
ExecutableParamsAddPatientAddIfNotPresent=1
ExecutableParamsPatientAddIfNotPresent="1"
ExecutableCreateINIFile=0
ExecutableWaitForMeasureConfirmationByUser=1
ExecutableMeasureFileExtensions=(jpg|pdf)

[NDD-OPTO00]
OutputGDTData=1
Description=

[GDT]
Format=export
Version=2.1
Charset=3
IgnoreMaxLineLength=1
NameValueSeparator=[=]
